name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6
          echo '{"appId":"com.bubbleern.game","appName":"Bubble Ern","webDir":"www","backgroundColor":"#0b1026"}' > capacitor.config.json
      - name: Add Android
        run: npx cap add android
      - name: Add AdMob App ID
        run: |
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7904876756316986~5746969431"/></application>#' android/app/src/main/AndroidManifest.xml
          grep APPLICATION_ID android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-ern-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
